name: docker
on:
  push:
    branches: [main]
    paths: [docker/**, .github/workflows/docker.yml]

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/akashpriyadarshii/c2proof/runner:c2rust-0.20.0
            ghcr.io/akashpriyadarshii/c2proof/runner:latest
